<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #profileCard {
            background-color: white;
            padding: 20px;
            width: 350px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        #profileImage {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            margin: 8px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .active-status {
            background-color: #d4edda !important;
            border: 3px solid #28a745;
        }
    </style>
</head>

<body>

    <div id="profileCard">

        <img src="C:/Users/YC Student/Desktop/dom profile/profile.jpg"
             alt="Profile Image"
             id="profileImage">

        <h2 id="profileName">John Doe</h2>

        <p id="profileRole">Software Developer</p>

        <p id="profileBio">
            Passionate about coding and learning new technologies.
        </p>

        <button id="updateNameBtn">Update Name</button>

        <button id="updateRoleBtn">Update Role</button>

        <button id="toggleStatusBtn">Toggle Active Status</button>

        <button id="changeImageBtn">Change Image</button>

    </div>

    <script>
        const profileName = document.getElementById("profileName");
        const profileRole = document.getElementById("profileRole");
        const profileCard = document.getElementById("profileCard");
        const profileImage = document.getElementById("profileImage");

        const updateNameBtn = document.getElementById("updateNameBtn");
        const updateRoleBtn = document.getElementById("updateRoleBtn");
        const toggleStatusBtn = document.getElementById("toggleStatusBtn");
        const changeImageBtn = document.getElementById("changeImageBtn");

        updateNameBtn.addEventListener("click", function () {
            let newName = prompt("Enter a new name:");

            if (newName !== null && newName.trim() !== "") {
                profileName.textContent = newName;
            }
        });

        updateRoleBtn.addEventListener("click", function () {
            let newRole = prompt("Enter a new role:");

            if (newRole !== null && newRole.trim() !== "") {
                profileRole.textContent = newRole;
            }
        });

        toggleStatusBtn.addEventListener("click", function () {
            profileCard.classList.toggle("active-status");
        });

        changeImageBtn.addEventListener("click", function () {
            let newImageUrl = prompt("Enter a new image URL:");

            if (newImageUrl !== null && newImageUrl.trim() !== "") {
                profileImage.src = newImageUrl;
            }
        });
    </script>

</body>

</html>
